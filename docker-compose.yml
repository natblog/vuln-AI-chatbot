services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3.5:4b}
      - OLLAMA_TEMPERATURE=${OLLAMA_TEMPERATURE:-0.2}
      - OLLAMA_MAX_TOKENS=${OLLAMA_MAX_TOKENS:-2048}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-600}
      - OLLAMA_THINK=${OLLAMA_THINK:-false}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.2}
      - OPENAI_MAX_TOKENS=${OPENAI_MAX_TOKENS:-2048}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-600}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - DB_PATH=/app/data/shop.db
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - CURRENT_USER_EMAIL=${CURRENT_USER_EMAIL:-alice@example.com}
      - ATTACKER_EMAIL=${ATTACKER_EMAIL:-someone@evil.ai}
      - FLAG=${FLAG:-FLAG{exfiltrated_secret_b0b_gpu_order_7f3a}}
    volumes:
      - ./data:/app/data
    depends_on:
      - mailhog
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    # NOTE: no VITE_* runtime env here on purpose — Vite bakes env at build
    # time, so the SPA always uses same-origin /api via the nginx proxy.
    depends_on:
      - backend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"
